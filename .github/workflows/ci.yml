name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify deployment inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Aspire CLI
        shell: bash
        run: |
          aspire_version="$(
            sed -n 's#.*Aspire.AppHost.Sdk/\([^"]*\).*#\1#p' \
              Aspire/ScarletPigsServices.AppHost/ScarletPigsServices.AppHost.csproj
          )"

          if [[ -z "$aspire_version" ]]; then
            echo "::error::Could not determine the Aspire CLI version from the AppHost project."
            exit 1
          fi

          curl -fsSL https://aspire.dev/install.sh |
            bash -s -- \
              --version "$aspire_version" \
              --install-path "$RUNNER_TEMP/aspire" \
              --skip-path

          echo "$RUNNER_TEMP/aspire" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/aspire/aspire" --version

      - name: Restore dependencies
        run: dotnet restore ScarletPigsServices.slnx

      - name: Run tests
        run: dotnet test ScarletPigsServices.slnx --no-restore

      - name: Validate migration bundle
        run: >
          aspire do migrationservice-generate-migration-bundle
          --apphost Aspire/ScarletPigsServices.AppHost/ScarletPigsServices.AppHost.csproj
          --environment Production
          --non-interactive
          --nologo
